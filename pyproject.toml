[project]
name = "semanticops"
version = "0.1.0"
description = "Industrial AI Agent — LLM-guided schema interpretation + time-series forecasting for process data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Portfolio Project", email = "your@email.com" }]
keywords = ["llm-agent", "forecasting", "industrial-ai", "time-series", "schema-interpretation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.1", "langchain-anthropic>=0.1"]
shap = ["shap>=0.44"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/yourusername/semanticops"
Repository = "https://github.com/yourusername/semanticops"
Issues = "https://github.com/yourusername/semanticops/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semanticops"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
